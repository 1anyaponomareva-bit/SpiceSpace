<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpiceSpace Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1A1A1A;
      --panel: #242424;
      --text: #F2F2F2;
      --muted: #9EA0A6;
      --accent: #D4F26B;
      --border: #323232;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { margin: 0 0 16px; font-size: 28px; }
    .muted { color: var(--muted); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .card .value { color: var(--accent); font-size: 28px; font-weight: 800; }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .goal {
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status { font-weight: 600; }
    .ok { color: #9AE66E; }
    .warn { color: #FFD56A; }
    .bad { color: #FF7E7E; }
    .claude { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .claude.alert { border-color: #FF7E7E; }
    .claude h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
    .claude .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: baseline; }
    .claude .big { font-size: 34px; font-weight: 800; color: var(--accent); }
    .claude .big.bad { color: #FF7E7E; }
    .claude .small { font-size: 13px; color: var(--muted); }
    .claude .small b { color: var(--text); font-size: 18px; }
    .claude .warnline { color: #FF7E7E; font-weight: 700; margin-top: 10px; }
    .claude form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .claude input { width: 120px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #1A1A1A; color: var(--text); font: inherit; }
    .claude button { padding: 8px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #1A1A1A; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <h1>SpiceSpace Admin</h1>
  <p class="muted" id="meta">Loading...</p>
  <div id="denied" style="display:none;">Access denied</div>
  <div id="app" style="display:none;">
    <div class="claude" id="claude">
      <h2>Claude API: деньги на счёте</h2>
      <div class="row">
        <div><div class="big" id="cl-left">—</div><div class="small" id="cl-left-note"></div></div>
        <div class="small">сегодня<br><b id="cl-today">—</b></div>
        <div class="small">за 7 дней<br><b id="cl-week">—</b></div>
        <div class="small">хватит на<br><b id="cl-days">—</b></div>
      </div>
      <div class="warnline" id="cl-warn" style="display:none;"></div>
      <form id="cl-form">
        <span class="small">Сколько сейчас в консоли Anthropic (Billing), $</span>
        <input id="cl-input" inputmode="decimal" placeholder="например 25.40" />
        <button type="submit">Сохранить</button>
        <span class="small" id="cl-saved"></span>
      </form>
    </div>
    <div class="cards" id="cards"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Goal</th>
            <th>Streak 🔥</th>
            <th>Week</th>
            <th>Last active</th>
            <th>Ответил 💬</th>
            <th>Сообщений сегодня</th>
            <th>Всего сообщений</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (() => {
      // Secret key comes in the URL fragment (#key=...), which browsers never send to servers.
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const adminKey = hashParams.get("key") || "";
      const tgInit = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || "";
      const denied = document.getElementById("denied");
      const app = document.getElementById("app");
      const cards = document.getElementById("cards");
      const body = document.getElementById("users-body");
      const meta = document.getElementById("meta");

      if (!adminKey && !tgInit) {
        denied.style.display = "block";
        meta.textContent = "Unauthorized";
        return;
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      function statusCell(u) {
        if (u.active_today) return '<span class="status ok">🟢 active today</span>';
        if (u.active_week) return '<span class="status warn">🟡 this week</span>';
        return '<span class="status bad">🔴 churned</span>';
      }

      function money(v) { return v == null ? "—" : "$" + Number(v).toFixed(2); }
      function authHeaders() {
        const h = {};
        if (adminKey) h["X-Admin-Key"] = adminKey;
        if (tgInit) h["Authorization"] = `tma ${tgInit}`;
        return h;
      }
      function renderClaude(c) {
        const left = document.getElementById("cl-left");
        document.getElementById("cl-today").textContent = money(c.spent_today_usd);
        document.getElementById("cl-week").textContent = money(c.spent_7d_usd);
        document.getElementById("cl-days").textContent = c.days_left == null ? "—" : `${c.days_left} дн.`;
        const note = document.getElementById("cl-left-note");
        if (c.balance_usd == null) {
          left.textContent = "?";
          note.textContent = "впиши остаток из консоли ниже — дальше бот будет вычитать расходы сам";
        } else {
          left.textContent = "≈ " + money(c.balance_usd);
          const d = new Date(c.balance_set_at);
          note.textContent = `примерно: ${money(c.balance_set_usd)} на ${d.toLocaleDateString()} минус ${money(c.spent_since_set_usd)} расходов бота`;
        }
        left.classList.toggle("bad", !!c.warn);
        document.getElementById("claude").classList.toggle("alert", !!c.warn);
        const w = document.getElementById("cl-warn");
        if (c.warn) {
          w.textContent = c.balance_usd != null && c.balance_usd <= 0
            ? "Деньги на Claude, похоже, закончились — пополни счёт, иначе бот перестанет отвечать"
            : `Денег осталось меньше чем на 7 дней (~${money(c.per_day_usd)} в день) — пора пополнить`;
          w.style.display = "block";
        } else {
          w.style.display = "none";
        }
      }
      async function loadClaude() {
        try {
          const r = await fetch("/api/admin/claude_balance", { cache: "no-store", headers: authHeaders() });
          if (r.ok) renderClaude(await r.json());
        } catch (e) { /* the rest of the panel still works */ }
      }
      document.getElementById("cl-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const saved = document.getElementById("cl-saved");
        const raw = document.getElementById("cl-input").value.trim().replace(",", ".");
        if (!raw || isNaN(Number(raw))) { saved.textContent = "введи число"; return; }
        try {
          const r = await fetch("/api/admin/claude_balance", {
            method: "POST",
            headers: { ...authHeaders(), "Content-Type": "application/json" },
            body: JSON.stringify({ balance_usd: Number(raw) }),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          saved.textContent = "сохранено";
          document.getElementById("cl-input").value = "";
          loadClaude();
        } catch (e) { saved.textContent = "не сохранилось: " + (e.message || e); }
      });

      function renderStats(stats) {
        const items = [
          ["Новые сегодня 🆕", stats.new_today || 0],
          ["Новые за неделю", stats.new_week || 0],
          ["Платят сейчас 💳", stats.paying || 0],
          ["Бесплатный доступ (фокус-группа)", stats.free_access || 0],
          ["Total users", stats.total || 0],
          ["Onboarded", stats.onboarded || 0],
          ["Active today", stats.active_today || 0],
          ["Ответили сегодня 💬", stats.replied_today || 0],
          ["Active this week", stats.active_week || 0],
          ["Churned (3+ days)", stats.churned || 0],
          ["Streak 3+ days", stats.streak_3plus || 0],
        ];
        cards.innerHTML = items.map(([label, value]) =>
          `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`
        ).join("");
      }

      function renderUsers(users) {
        body.innerHTML = (users || []).map((u) => `
          <tr>
            <td>${esc(u.name || "—")}</td>
            <td class="goal" title="${esc(u.main_goal || "")}">${esc(u.main_goal || "—")}</td>
            <td>${Number(u.streak || 0)}</td>
            <td>${Number(u.current_week || 1)}</td>
            <td>${esc(u.last_active || "—")}</td>
            <td>${u.replied_today ? "✅" : "—"}</td>
            <td>${esc(u.messages_today || "—")}</td>
            <td>${esc(u.messages_total || "—")}</td>
            <td>${statusCell(u)}</td>
          </tr>
        `).join("");
      }

      async function loadStats() {
        try {
          const headers = {};
          if (adminKey) headers["X-Admin-Key"] = adminKey;
          if (tgInit) headers["Authorization"] = `tma ${tgInit}`;
          const resp = await fetch("/api/admin/stats", { cache: "no-store", headers });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          renderStats(data.stats || {});
          renderUsers(data.users || []);
          app.style.display = "block";
          denied.style.display = "none";
          meta.textContent = `Updated: ${new Date().toLocaleString()}`;
        } catch (e) {
          meta.textContent = `Failed to load stats: ${e.message || e}`;
        }
      }

      loadStats();
      loadClaude();
      setInterval(() => { loadStats(); loadClaude(); }, 60000);
    })();
  </script>
</body>
</html>
